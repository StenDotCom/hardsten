<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>Yestin Cruz — Computer Engineering Portfolio | John Yestin F. Cruz</title>
    <meta
      name="description"
      content="Portfolio of John Yestin F. Cruz (Yestin Cruz, @Hardsten), a fourth-year Computer Engineering student at ICCT Colleges focused on embedded systems, electronics, hardware prototyping, and automation."
    />
    <meta name="author" content="John Yestin F. Cruz" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F4F4ED" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yestin Cruz — Engineering Portfolio" />
    <meta property="og:title" content="Yestin Cruz — Computer Engineering Portfolio" />
    <meta
      property="og:description"
      content="Engineering Ideas Into Working Prototypes. Hardware prototyping, embedded systems, electronics, and automation projects by John Yestin F. Cruz."
    />
    <meta property="og:image" content="%BASE_URL%images/profile/profile.jpg" />
    <meta property="og:locale" content="en_PH" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yestin Cruz — Computer Engineering Portfolio" />
    <meta
      name="twitter:description"
      content="Fourth-year Computer Engineering student at ICCT Colleges focused on embedded systems, electronics, hardware prototyping, and automation."
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "John Yestin F. Cruz",
        "alternateName": ["Yestin Cruz", "Hardsten"],
        "email": "mailto:yestincruz471@gmail.com",
        "jobTitle": "Computer Engineering Student",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "ICCT Colleges",
          "url": "https://icct.edu.ph/"
        },
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "PH"
        },
        "knowsAbout": [
          "Embedded Systems",
          "Electronics",
          "Hardware Prototyping",
          "Automation",
          "Arduino",
          "KiCad",
          "AutoCAD"
        ],
        "sameAs": [
          "https://github.com/StenDotCom",
          "https://www.facebook.com/cruuxxx/",
          "https://www.instagram.com/sten.com_/"
        ]
      }
    </script>

    <!-- Set light/dark theme before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('yc-theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          if (t === 'dark') {
            var bar = document.querySelector('meta[name="theme-color"]');
            if (bar) bar.setAttribute('content', '#070B14');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
